name: audit-doc-finalize

on:
  push:
    branches: [audit/comprehensive-20260831]

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/comprehensive-20260831
      - name: Align runtime provenance and evidence documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {count}')
              return updated

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              '| Evidence | Native metrics plus business headline values and structured threshold-breach details remain authoritative. |',
              '| Evidence | Native k6 metrics remain runtime signals; retained JSON is an allowlisted headline projection with structured threshold-breach details. |'
          )
          text = text.replace(
              '| Runtime source | `docker/Dockerfile` pins the k6 runtime; CI/extended build that file rather than duplicating image tags in workflow shell. |',
              '| Runtime source | `docker/Dockerfile` owns the upstream release marker, exact source version/commit, patched Go builder, and final runtime image; CI/extended build that file rather than duplicating runtime versions in workflow shell. |'
          )
          readme_runtime = (
              '`docker/Dockerfile` is the single tracked runtime/provenance source used by CI and extended profile contracts. '
              'It retains a digest-pinned official `grafana/k6:<version>` stage as the upstream release marker that Docker Dependabot can observe, but the executing `/usr/bin/k6` is rebuilt from the exact `K6_VERSION` tag and `K6_COMMIT` with a digest-pinned patched Go builder. '
              'The source checkout fails unless the fetched release tag resolves to the committed revision.\n\n'
              'The final Alpine stage is separately digest-pinned, updated during the build, and scanned as the actual produced image. '
              'This separation exists because the current official k6 2.2.0 image was compiled with a Go toolchain that had fixed HIGH vulnerabilities; merely upgrading its Alpine packages would not remediate vulnerabilities compiled into the k6 binary.\n\n'
              'Dependency automation is therefore a **release signal, not an automatic runtime switch**. CI derives the expected k6 version from the official release-marker `FROM` line and compares it with the rebuilt binary. '
              'If Dependabot changes the marker without the reviewed `K6_VERSION`/`K6_COMMIT` source pins being synchronized, the packaged-runtime gate fails. '
              'A runtime update must review the upstream release, synchronize source provenance, and pass guardrails, smoke, extended initialization, CodeQL, repository Trivy, and built-image Trivy.\n\n'
              "The image's default command remains `k6 version`, so starting it cannot silently run smoke/load/stress/soak. Traffic requires an explicit `run ...` command plus `K6_BASE_URL`; sustained traffic still requires the separate authorization contract. "
              'CI verifies startup/runtime identity before smoke, while extended jobs build the same image and use `inspect` only.'
          )
          text = replace_once(
              text,
              r'`docker/Dockerfile` is the single tracked source for the pinned k6 runtime used by CI and extended profile contracts\..*?A Dockerfile change therefore exercises both packaged-runtime safety and profile initialization\.',
              readme_runtime,
              'README packaged runtime'
          )
          text = text.replace(
              '- the Dockerfile is the actual k6 runtime source consumed by CI/extended, avoiding version drift between manifest and workflow shell;',
              '- Docker updates surface the upstream release marker; runtime PRs must also synchronize the exact source version/commit, and CI rejects marker/binary version drift;'
          )
          text = text.replace(
              'Dependabot does not replace digest pinning, non-root container policy, CodeQL, repository/image Trivy, Dependency Review, or workload authorization.',
              'Dependabot does not replace image/source provenance checks, digest pinning, the patched Go toolchain decision, non-root container policy, CodeQL, repository/image Trivy, Dependency Review, or workload authorization.'
          )
          readme.write_text(text)

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text()
          architecture_runtime = (
              '`docker/Dockerfile` is the single repository-owned runtime/provenance source used by CI. '
              'Its digest-pinned official `grafana/k6:<version>` stage is an upstream release marker for Docker Dependabot; the executing binary is rebuilt from the exact `K6_VERSION` tag and `K6_COMMIT` with a digest-pinned patched Go toolchain. '
              'The build verifies that the fetched tag resolves to the committed source revision before compiling.\n\n'
              "CI derives the expected runtime version from the official release-marker `FROM` reference and compares it with the rebuilt image's `k6 version`. "
              'A Dependabot marker update therefore fails closed until the reviewed source version/commit are synchronized. '
              'The final Alpine runtime is separately pinned, updated during image construction, and scanned after build so OS fixes and vulnerabilities compiled into the Go binary are treated as distinct concerns.\n\n'
              'The custom rebuild is deliberate: the official k6 2.2.0 image was built with a Go version that had fixed HIGH vulnerabilities, which an Alpine-only package upgrade could not remove. '
              'The produced image remains non-root and its default command is `k6 version`, so starting it without explicit `run ...` arguments generates **zero traffic**.\n\n'
              'Extended `inspect` and primary smoke gates use the same tracked image. Guardrails, runtime-version verification, built-image Trivy, and exact source-revision verification make provenance drift a failing condition rather than a documentation convention.'
          )
          text = replace_once(
              text,
              r'`docker/Dockerfile` is the single repository-owned source for the k6 runtime image/version used by CI\..*?Extended `inspect` and primary smoke gates use the same tracked image, so the dependency source, safety checks, and executing runtime cannot drift independently\.',
              architecture_runtime,
              'architecture packaged runtime'
          )
          text = text.replace('- `business_failures` (`Counter`);', '- `business_failures` (`Rate`);')
          text = text.replace('- raw metric summaries;', '- allowlisted headline HTTP/check/business metric values;')
          text = text.replace(
              '5. preserve the Dockerfile as the single tracked runtime-image source;',
              '5. preserve the Dockerfile as the single tracked runtime/provenance source and keep its release marker, source pins, builder, and produced image coherent;'
          )
          architecture.write_text(text)

          strategy = Path('docs/TEST_STRATEGY.md')
          text = strategy.read_text()
          strategy_runtime = (
              '`docker/Dockerfile` is the single tracked runtime/provenance source used by CI and extended profile contracts. '
              'A digest-pinned official k6 stage is retained as the Docker-Dependabot release marker, while the executing binary is rebuilt from the exact release tag and committed upstream revision with a digest-pinned patched Go toolchain. '
              'The build fails if the fetched tag does not resolve to that revision.\n\n'
              'CI derives the expected version from the release-marker `FROM` reference and verifies that the rebuilt image reports the same version. '
              'This makes a Dependabot marker update a review signal: it cannot become a green runtime update until the source version/commit are intentionally synchronized. '
              'Built-image Trivy then evaluates the produced runtime, covering both final OS packages and vulnerabilities compiled into the Go binary.\n\n'
              'The source rebuild is intentional for k6 2.2.0 because its official image was compiled with a Go toolchain containing fixed HIGH vulnerabilities; updating only Alpine packages would leave those findings in the binary. '
              'The project image remains non-root and deliberately non-traffic-generating by default: starting it without an explicit scenario command runs `k6 version`. '
              'Traffic therefore requires an explicit `run ...` command plus a valid `K6_BASE_URL`; sustained traffic still requires the additional opt-in and exact-host allowlist.'
          )
          text = replace_once(
              text,
              r'`docker/Dockerfile` is the single tracked source for the k6 runtime image used by CI and extended profile contracts\..*?The image default command is deliberately non-traffic-generating: starting the image without an explicit scenario command runs `k6 version`\. Traffic therefore requires an explicit `run \.\.\.` command plus a valid `K6_BASE_URL`; sustained traffic still requires the additional opt-in and exact-host allowlist\.',
              strategy_runtime,
              'strategy packaged runtime'
          )
          strategy.write_text(text)
          PY
      - name: Validate documentation contract
        run: |
          git diff --check
          python .github/scripts/validate_readme.py
      - name: Commit validated documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/ARCHITECTURE.md docs/TEST_STRATEGY.md
          git diff --cached --check
          git commit -m "Document k6 runtime provenance and evidence contract"
          git push origin HEAD:audit/comprehensive-20260831
