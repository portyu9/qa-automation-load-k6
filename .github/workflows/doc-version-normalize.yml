name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize k6 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('README.md'),*sorted(Path('docs').rglob('*.md'))]
          techs=['k6','Grafana k6','Go','Alpine','Docker','JavaScript','Trivy','CodeQL']
          exact={'k6 2.2.0':'k6','Go 1.26.7':'Go','Alpine 3.24.1':'Alpine','Alpine 3.24':'Alpine'}
          for path in files:
            text=path.read_text(encoding='utf-8')
            for a,b in exact.items(): text=text.replace(a,b)
            for tech in techs:
              text=re.sub(rf'(?i)\b{re.escape(tech)}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?(?:\*\*|`)?',tech,text)
            for image in ['grafana/k6','golang','alpine']:
              text=re.sub(rf'(?i)\b{re.escape(image)}:\d[^\s`"\)]+',f'{image}:<pinned-tag>',text)
            text=re.sub(r'(?i)\bK6_VERSION=\d+(?:\.\d+)*','K6_VERSION=<pinned-version>',text)
            path.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=r'(?:k6|Grafana k6|Go|Alpine|Docker|JavaScript|Trivy|CodeQL)'
          pats=[re.compile(rf'(?i)\b{names}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?'),re.compile(r'(?i)\b(?:grafana/k6|golang|alpine):\d'),re.compile(r'(?i)\bK6_VERSION=\d')]
          bad=[]
          for p in [Path('README.md'),*sorted(Path('docs').rglob('*.md'))]:
            for n,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(x.search(l) for x in pats): bad.append(f'{p}:{n}: {l}')
          if bad: print('\n'.join(bad)); raise SystemExit(1)
          PY
          python3 .github/scripts/validate_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD
