name: apply-security-diagram-rescan

on:
  push:
    branches: [docs/security-diagram-rescan]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/security-diagram-rescan
      - name: Align security architecture with required supply-chain policy
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('| Security | Source, repository, and packaged-runtime exposure | No target traffic | CodeQL + repository/image Trivy + Dependency Review when available |', '| Security | Runtime/workflow provenance plus source, repository, and packaged-runtime exposure | No target traffic | Supply-chain policy + CodeQL + repository/image Trivy + Dependency Review when available |'),
            ('    SAST[CodeQL] --> SG[Security / security-gate]\n', '    SUPPLY[Supply-chain provenance policy] --> SG[Security / security-gate]\n    SAST[CodeQL] --> SG\n'),
            ('    class CIG,EG,DG,SAST,REPO,IMAGE,REVIEW,SG gate;\n', '    class CIG,EG,DG,SUPPLY,SAST,REPO,IMAGE,REVIEW,SG gate;\n'),
          ]
          for old, new in replacements:
            if s.count(old) != 1:
              raise SystemExit(f'expected one k6 security fragment: {old!r}')
            s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: show supply-chain policy in security architecture'
          git push origin HEAD:docs/security-diagram-rescan
