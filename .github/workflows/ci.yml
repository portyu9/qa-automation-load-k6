name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_BASE_URL: https://jsonplaceholder.typicode.com
  K6_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run pinned k6 smoke gate
        run: >-
          docker run --rm
          -e K6_BASE_URL
          -e K6_RUN_ID
          -v "${PWD}:/src"
          -w /src
          grafana/k6:2.2.0
          run tests/smoke.js
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke-summary
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
