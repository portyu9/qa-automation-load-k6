name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_BASE_URL: http://127.0.0.1:4020
  K6_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell refusal contract
        run: bash scripts/test_guardrails.sh
      - name: Validate local fixture syntax
        run: node --check scripts/local-api.js
      - name: Validate k6 runtime refusal contract without sending traffic
        run: |
          set -euo pipefail
          common=(
            --rm
            -e K6_BASE_URL
            -e K6_RUN_ID
            -v "${PWD}:/src"
            -w /src
            grafana/k6:2.2.0
            inspect --include-system-env-vars tests/load.js
          )

          if docker run "${common[@]}" >/dev/null 2>&1; then
            echo "load profile unexpectedly initialized without K6_ALLOW_LOAD_TEST" >&2
            exit 1
          fi

          if docker run \
            --rm \
            -e K6_BASE_URL \
            -e K6_RUN_ID \
            -e K6_ALLOW_LOAD_TEST=true \
            -e K6_ALLOWED_HOSTS=example.invalid \
            -v "${PWD}:/src" \
            -w /src \
            grafana/k6:2.2.0 \
            inspect --include-system-env-vars tests/load.js >/dev/null 2>&1; then
            echo "load profile unexpectedly initialized for a non-allowlisted host" >&2
            exit 1
          fi

          if docker run \
            --rm \
            -e K6_BASE_URL=http://user:password@127.0.0.1:4020 \
            -e K6_RUN_ID \
            -e K6_ALLOW_LOAD_TEST=true \
            -e K6_ALLOWED_HOSTS=127.0.0.1 \
            -v "${PWD}:/src" \
            -w /src \
            grafana/k6:2.2.0 \
            inspect --include-system-env-vars tests/load.js >/dev/null 2>&1; then
            echo "load profile unexpectedly accepted URL credentials" >&2
            exit 1
          fi

          if docker run \
            --rm \
            -e K6_BASE_URL='http://127.0.0.1:4020?token=secret' \
            -e K6_RUN_ID \
            -e K6_ALLOW_LOAD_TEST=true \
            -e K6_ALLOWED_HOSTS=127.0.0.1 \
            -v "${PWD}:/src" \
            -w /src \
            grafana/k6:2.2.0 \
            inspect --include-system-env-vars tests/load.js >/dev/null 2>&1; then
            echo "load profile unexpectedly accepted a query-bearing base URL" >&2
            exit 1
          fi

          docker run \
            --rm \
            -e K6_BASE_URL \
            -e K6_RUN_ID \
            -e K6_ALLOW_LOAD_TEST=true \
            -e K6_ALLOWED_HOSTS=127.0.0.1 \
            -v "${PWD}:/src" \
            -w /src \
            grafana/k6:2.2.0 \
            inspect --include-system-env-vars tests/load.js >/dev/null

  smoke:
    needs: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run pinned k6 smoke gate against repository-owned fixture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/local-api.js > /tmp/k6-local-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4020/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/k6-local-api.log >&2
            exit 1
          fi

          docker run --rm \
            --network host \
            -e K6_BASE_URL \
            -e K6_RUN_ID \
            -v "${PWD}:/src" \
            -w /src \
            grafana/k6:2.2.0 \
            run tests/smoke.js
      - name: Publish smoke observability summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s reports/summary.json ]]; then
            requests=$(jq -r '.headline.requests // 0' reports/summary.json)
            failed_rate=$(jq -r '.headline.failedRate // 0' reports/summary.json)
            p95=$(jq -r '.headline.p95Ms // 0' reports/summary.json)
            checks=$(jq -r '.headline.checksRate // 0' reports/summary.json)
            breaches=$(jq -r '.headline.thresholdBreaches | length' reports/summary.json)
            {
              echo '### k6 · smoke'
              echo
              echo "- Run ID: \`${K6_RUN_ID}\`"
              echo '- Target: repository-owned loopback fixture (`127.0.0.1:4020`)'
              echo "- Job status: \`${{ job.status }}\`"
              echo "- Requests: \`${requests}\`"
              echo "- HTTP failure rate: \`${failed_rate}\`"
              echo "- p95: \`${p95} ms\`"
              echo "- Check rate: \`${checks}\`"
              echo "- Threshold breaches: \`${breaches}\`"
              echo '- Evidence: structured k6 summary JSON + text headline'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### k6 · smoke\n\nNo structured summary was produced; inspect the smoke step.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke-summary
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
