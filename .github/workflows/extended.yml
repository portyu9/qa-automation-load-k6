name: extended

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k6-extended-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sustained-profile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [load, stress, soak]
    env:
      K6_BASE_URL: https://example.invalid
      K6_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      K6_ALLOW_LOAD_TEST: "true"
      K6_ALLOWED_HOSTS: example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable workflow and runtime provenance
        run: |
          python3 .github/scripts/validate_workflow_pins.py
          python3 .github/scripts/validate_runtime_provenance.py
      - name: Prepare evidence directory
        run: mkdir -p reports
      - name: Build tracked k6 image
        run: docker build -f docker/Dockerfile -t qa-k6:extended .
      - name: Reject invalid soak configuration without traffic
        if: matrix.profile == 'soak'
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --rm
            -e K6_BASE_URL
            -e K6_RUN_ID
            -e K6_ALLOW_LOAD_TEST
            -e K6_ALLOWED_HOSTS
            -v "${PWD}:/src"
            -w /src
            qa-k6:extended
            inspect --include-system-env-vars tests/soak.js
          )

          if docker run -e K6_SOAK_RATE=0 "${common[@]}" >/dev/null 2>&1; then
            echo "soak profile unexpectedly accepted a non-positive arrival rate" >&2
            exit 1
          fi
          if docker run -e K6_SOAK_DURATION=forever "${common[@]}" >/dev/null 2>&1; then
            echo "soak profile unexpectedly accepted an invalid duration" >&2
            exit 1
          fi
          docker run \
            -e K6_SOAK_RATE=7 \
            -e K6_SOAK_DURATION=1h30m \
            "${common[@]}" >/dev/null
      - name: Inspect ${{ matrix.profile }} profile without executing traffic
        run: >-
          docker run --rm
          -e K6_BASE_URL
          -e K6_RUN_ID
          -e K6_ALLOW_LOAD_TEST
          -e K6_ALLOWED_HOSTS
          -v "${PWD}:/src"
          -w /src
          qa-k6:extended
          inspect --include-system-env-vars tests/${{ matrix.profile }}.js
          > reports/${{ matrix.profile }}-inspect.json
      - name: Validate resolved ${{ matrix.profile }} scenario and threshold evidence
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          report="reports/${PROFILE}-inspect.json"
          test -s "$report"

          case "$PROFILE" in
            load)
              jq -e '
                (.scenarios | keys) == ["load"] and
                .scenarios.load == {
                  "executor": "ramping-arrival-rate",
                  "startTime": null,
                  "gracefulStop": "30s",
                  "env": null,
                  "exec": null,
                  "tags": {"profile": "load"},
                  "startRate": 2,
                  "timeUnit": "1s",
                  "stages": [
                    {"duration": "30s", "target": 5},
                    {"duration": "1m0s", "target": 10},
                    {"duration": "30s", "target": 0}
                  ],
                  "preAllocatedVUs": 10,
                  "maxVUs": 50
                } and
                .thresholds == {
                  "business_failures": ["rate<=0.01"],
                  "business_success": ["rate>=0.99"],
                  "checks": ["rate>=0.99"],
                  "dropped_iterations": ["count<1"],
                  "http_req_duration": ["p(95)<500"],
                  "http_req_failed": ["rate<=0.01"]
                }
              ' "$report" >/dev/null
              ;;
            stress)
              jq -e '
                (.scenarios | keys) == ["stress"] and
                .scenarios.stress == {
                  "executor": "ramping-arrival-rate",
                  "startTime": null,
                  "gracefulStop": "30s",
                  "env": null,
                  "exec": null,
                  "tags": {"profile": "stress"},
                  "startRate": 2,
                  "timeUnit": "1s",
                  "stages": [
                    {"duration": "30s", "target": 10},
                    {"duration": "30s", "target": 20},
                    {"duration": "30s", "target": 30},
                    {"duration": "30s", "target": 0}
                  ],
                  "preAllocatedVUs": 20,
                  "maxVUs": 100
                } and
                .thresholds == {
                  "business_failures": ["rate<=0.03"],
                  "business_success": ["rate>=0.97"],
                  "checks": ["rate>=0.97"],
                  "http_req_duration": ["p(95)<1000"],
                  "http_req_failed": ["rate<=0.03"]
                }
              ' "$report" >/dev/null
              ;;
            soak)
              jq -e '
                (.scenarios | keys) == ["soak"] and
                .scenarios.soak == {
                  "executor": "constant-arrival-rate",
                  "startTime": null,
                  "gracefulStop": "30s",
                  "env": null,
                  "exec": null,
                  "tags": {"profile": "soak"},
                  "rate": 5,
                  "timeUnit": "1s",
                  "duration": "10m0s",
                  "preAllocatedVUs": 10,
                  "maxVUs": 50
                } and
                .thresholds == {
                  "business_failures": ["rate<=0.01"],
                  "business_success": ["rate>=0.99"],
                  "checks": ["rate>=0.99"],
                  "dropped_iterations": ["count<1"],
                  "http_req_duration": ["p(95)<500"],
                  "http_req_failed": ["rate<=0.01"]
                }
              ' "$report" >/dev/null
              ;;
            *)
              echo "unsupported profile contract: $PROFILE" >&2
              exit 1
              ;;
          esac
      - name: Publish profile observability summary
        if: always()
        run: |
          {
            echo "### k6 · ${{ matrix.profile }} profile contract"
            echo
            echo "- Run ID: \`${K6_RUN_ID}\`"
            echo '- Execution mode: `k6 inspect` (module/configuration initialization only)'
            echo '- Target identity: `example.invalid` exact allowlist match'
            echo '- Evidence: exact resolved scenario shape + threshold expressions'
            echo '- Runtime provenance: committed immutable Action and Docker image contracts validated before inspection'
            echo '- Sustained scenario traffic: **not executed**'
            echo "- Job status: \`${{ job.status }}\`"
          } | tee reports/${{ matrix.profile }}-extended-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ matrix.profile }}-profile-contract-${{ github.run_id }}
          path: |
            reports/${{ matrix.profile }}-inspect.json
            reports/${{ matrix.profile }}-extended-summary.md
          if-no-files-found: error
          retention-days: 14

  extended-gate:
    name: extended-gate
    if: always()
    needs: sustained-profile-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every sustained profile contract
        shell: bash
        env:
          PROFILE_RESULT: ${{ needs.sustained-profile-contract.result }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE_RESULT" != "success" ]]; then
            echo "sustained profile matrix result: $PROFILE_RESULT" >&2
            exit 1
          fi
          echo "All zero-traffic sustained profile contracts passed."
